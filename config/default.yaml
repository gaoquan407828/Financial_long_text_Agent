model_name: qwen3.6-plus
api_base: ${QWEN_API_BASE:https://dashscope.aliyuncs.com/compatible-mode/v1}
api_key_env: QWEN_API_KEY
temperature: 0
max_retries: 3
timeout_seconds: 120

raw_data_dir: dataset/raw
questions_dir: dataset/questions/group_a
processed_dir: processed_data
documents_dir: processed_data/documents
chunks_dir: processed_data/chunks
metadata_dir: processed_data/metadata
index_dir: processed_data/indexes
markdown_dir: processed_data/markdown
output_dir: outputs
log_dir: logs

chunk_max_chars: 1800
chunk_overlap_chars: 260
min_chunk_chars: 80
domain_chunking:
  regulatory:
    max_chars: 1400
    overlap_chars: 180
    split_by_articles: true
  insurance:
    max_chars: 1500
    overlap_chars: 220
    split_by_clauses: true
  financial_reports:
    max_chars: 2200
    overlap_chars: 320
    preserve_tables: true
  financial_contracts:
    max_chars: 1800
    overlap_chars: 260
    split_by_clauses: true
  research:
    max_chars: 2200
    overlap_chars: 320

retrieve_top_k_docs: 10
retrieve_stage1_top_k_docs: 36
retrieve_top_k_chunks: 36
per_option_top_k: 8
per_doc_probe_top_k: 3
neighbor_window: 1
neighbor_max_seed_items: 12
evidence_rerank_weight: 1.0
numeric_match_boost: 2.0
metric_match_boost: 1.4
option_match_boost: 1.2
max_context_chars: 24000
max_evidence_chars_per_chunk: 1600
max_compressed_chars_per_chunk: 1800
table_line_neighbor_window: 1
option_coverage_min: 2
enable_qwen_compression: false

whether_enable_second_pass: true
second_pass_min_confidence: 0.68
second_pass_answer_formats:
  - multi
second_pass_question_kinds:
  - calculation
  - comparison
allow_mock_when_no_api: false

calculation:
  enabled: true
  direct_answer_enabled: false
  direct_answer_min_confidence: 0.88

pdf:
  parser_order:
    - mineru
    - pymupdf4llm
    - pdftotext
    - pypdf
  save_markdown: true
  mineru_markdown_dir: processed_data/mineru_markdown
  mineru_output_dir: processed_data/mineru_output
  mineru_command: ${MINERU_COMMAND:}
  mineru_timeout_seconds: 1800
  pymupdf4llm_page_chunks: true
  pymupdf4llm_use_ocr: false
  pymupdf4llm_force_ocr: false
  prefer_pdftotext: true
  ocr_enabled: false
  ocr_lang: ${OCR_LANG:chi_sim+eng}
  ocr_dpi: 220
  min_text_chars_per_page: 40
  max_ocr_pages: 0
